[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bitpin-ai-connector"
version = "0.1.0"
description = "Independent Bitpin MCP connector for ChatGPT, Claude and other MCP clients"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp==1.30.0", "httpx==0.28.1", "pydantic-settings==2.15.0", "uvicorn==0.54.0"]

[project.scripts]
bitpin-ai-connector = "bitpin_connector.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.17,<0.18"]

[tool.hatch.build.targets.wheel]
packages = ["src/bitpin_connector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
